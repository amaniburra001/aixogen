<!DOCTYPE html>
<html>
<head>
  <title>Aixogen - AI Automation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ICONS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      color: #111;
    }

    /* NAVBAR */
    nav {
      position: sticky;
      top: 0;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      border-bottom: 1px solid #eee;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
    }

    .logo img {
      height: 35px;
      margin-right: 10px;
    }

    .menu {
      display: flex;
      align-items: center;
    }

    .menu a {
      margin: 0 15px;
      text-decoration: none;
      color: #111;
      font-size: 14px;
    }

    .menu a:hover {
      color: #2563eb;
    }

    .btn {
      background: #2563eb;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
    }

    /* DROPDOWN */
    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: white;
      width: 280px;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown-content a {
      display: block;
      padding: 10px;
      cursor: pointer;
    }

    /* HERO */
    .hero {
      height: 450px;
      background: url('background.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-overlay {
      background: rgba(0,0,0,0.5);
      padding: 30px;
      color: white;
      border-radius: 10px;
      text-align: center;
    }

    /* SERVICES SLIDER */
    .services {
      padding: 60px 0;
      overflow: hidden;
    }

    .slider-wrapper {
      position: relative;
    }

    .slider {
      display: flex;
      gap: 20px;
      padding: 20px;
      overflow-x: auto;
      scroll-behavior: smooth;
    }

    .slider::-webkit-scrollbar {
      display: none;
    }

    .card {
      min-width: 300px;
      flex: 0 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    /* ARROWS */
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    .left { left: 10px; }
    .right { right: 10px; }

    /* SECTIONS */
    .section {
      padding: 60px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    /* MOBILE */
    @media(max-width:768px){
      nav { flex-direction: column; }
      .menu { flex-wrap: wrap; }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">
    <img src="aixogen_logo.png">
    AIXOGEN
  </div>

  <div class="menu">

    <div class="dropdown">
      <a href="#">Services</a>
      <div class="dropdown-content">
        <a onclick="goTo(0)">Healthcare</a>
        <a onclick="goTo(1)">Real Estate</a>
        <a onclick="goTo(2)">HR</a>
        <a onclick="goTo(3)">IT</a>
        <a onclick="goTo(4)">Customer Support</a>
        <a onclick="goTo(5)">Finance</a>
        <a onclick="goTo(5)">Education</a>
      </div>
    </div>

    <a href="#products">Products</a>
    <a href="#solutions">Solutions</a>
    <a href="#about">About</a>

    <a href="#demo" class="btn">Request Demo</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-overlay">
    <h1>AI Automation for Modern Businesses</h1>
  </div>
</section>

<!-- SERVICES -->
<section class="services" id="services">
  <h2 style="padding-left:20px;">Our Services</h2>

  <div class="slider-wrapper">
    <button class="arrow left" onclick="scrollSlider(-1)">❮</button>

    <div class="slider" id="slider">

      <div class="card"><img src="healthcare.png"><div class="card-content"><h3>Healthcare</h3></div></div>

      <div class="card"><img src="realestate"><div class="card-content"><h3>Real Estate</h3></div></div>

      <div class="card"><img src="hr"><div class="card-content"><h3>HR</h3></div></div>

      <div class="card"><img src="IT.png"><div class="card-content"><h3>IT</h3></div></div>

      <div class="card"><img src="customersupport.png"><div class="card-content"><h3>Support</h3></div></div>

      <div class="card"><img src="finance.png"><div class="card-content"><h3>Finance</h3></div></div>

      <div class="card"><img src="education.png"><div class="card-content"><h3>Education</h3></div></div>

    </div>

    <button class="arrow right" onclick="scrollSlider(1)">❯</button>
  </div>
</section>

<!-- PRODUCTS -->
<section class="section" id="products">
  <h2>Products</h2>
</section>

<!-- DEMO -->
<section class="section" id="demo">
  <h2>Request Demo</h2>
</section>

<footer>
  © 2026 Aixogen
</footer>

<script>
const slider = document.getElementById('slider');

function scrollSlider(direction) {
  slider.scrollBy({
    left: direction * 320,
    behavior: 'smooth'
  });
}

function goTo(index){
  document.getElementById('services').scrollIntoView({behavior:'smooth'});
  slider.scrollTo({
    left: index * 320,
    behavior: 'smooth'
  });
}
</script>

</body>
</html>
